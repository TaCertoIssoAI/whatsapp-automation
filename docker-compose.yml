version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PO Token provider para yt-dlp (bypass YouTube bot detection)
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: whatsapp-pot-provider
    restart: unless-stopped
    init: true

  whatsapp-bot:
    build: .
    container_name: whatsapp-integration
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      pot-provider:
        condition: service_started
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      # WhatsApp Business Cloud API
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      
      # Google Gemini
      - PROJECT_ID=${PROJECT_ID}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-global}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - GEMINI_TRANSCRIPTION_MODEL=${GEMINI_TRANSCRIPTION_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_VIDEO_MODEL=${GEMINI_VIDEO_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-2.5-flash-tts}
      - GEMINI_TTS_VOICE=${GEMINI_TTS_VOICE:-Kore}
      - GEMINI_CLASSIFIER_MODEL=${GEMINI_CLASSIFIER_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-2.5-flash-lite}
      
      # Google Cloud Vision API
      - GOOGLE_CLOUD_API_KEY=${GOOGLE_CLOUD_API_KEY}
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      
      # Fact-checking API
      - FACT_CHECK_API_URL=${FACT_CHECK_API_URL:-https://ta-certo-isso-ai-767652480333.southamerica-east1.run.app}
      
      # Firebase / Rate Limiting
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
      - HASH_SALT=${HASH_SALT}
      - DAILY_MESSAGE_LIMIT=${DAILY_MESSAGE_LIMIT:-5}
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
      
      # PO Token provider para yt-dlp (YouTube)
      - POT_PROVIDER_URL=http://pot-provider:4416
      
      # Servidor
      - WEBHOOK_PORT=${WEBHOOK_PORT:-5000}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
